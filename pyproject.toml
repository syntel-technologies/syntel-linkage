[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "syntel-linkage"
version = "0.1.0"
description = "Probabilistic record linkage by the Fellegi-Sunter method, in the standard library"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "Syntel Technologies" }]
# No runtime dependencies. The arithmetic is standard-library only, which is the point: this
# package exists so a service can link records without inheriting a copyleft closure.
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "pyright==1.1.414",
]

[tool.hatch.build.targets.wheel]
packages = ["src/syntel_linkage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider", "--strict-markers"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "N", "C4", "PIE", "RET", "SLF"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tests"]
typeCheckingMode = "strict"
